- name: Enable locales
  become: true
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?({{ item | regex_escape }})\s*$'
    line: '\1'
    backrefs: true
  loop:
    - en_US.UTF-8 UTF-8
  notify:
    - Generate locales

- name: Trigger locale generation
  ansible.builtin.meta: flush_handlers

- name: Configure locale
  become: true
  community.general.ini_file:
    path: /etc/locale.conf
    owner: root
    group: root
    mode: "644"
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    ignore_spaces: true
    no_extra_spaces: true
  loop: "{{ settings | dict2items }}"
  vars:
    settings:
      LANG: en_US.UTF-8
