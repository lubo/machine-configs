- name: Install package
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
  loop: []

- name: Check AUR package is installed
  ansible.builtin.package:
    name: "{{ item }}"
  check_mode: true
  loop:
    - brave-bin
    - disig-web-signer
    - docker-rootless-extras
    - eidklient-native
    - gnome-shell-extension-clipboard-indicator-latest
    - google-chrome
    - needrestart
    - visual-studio-code-bin
    - yay
