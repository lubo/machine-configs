[installer]
no-binary = [":all:"]
only-binary = [
    "playwright", # https://github.com/microsoft/playwright-python/issues/3036
]

[solver]
min-release-age = 2

[virtualenvs.options]
# Deduplicates packages on the system and prevents unnecessary builds whenever
# possible.
# Also, helps when a package cannot be installed from PyPI. See:
# https://github.com/microsoft/playwright-python/issues/3036
system-site-packages = true
