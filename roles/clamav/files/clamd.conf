ExcludePath ^/dev/(?!shm/)
ExcludePath ^/proc/
ExcludePath ^/root/quarantine/
ExcludePath ^/swap$
ExcludePath ^/sys/

# Focus on user-writable paths.
OnAccessIncludePath /dev/shm
OnAccessIncludePath /home
OnAccessIncludePath /root
OnAccessIncludePath /run/user
OnAccessIncludePath /tmp
OnAccessIncludePath /var/spool/mail
OnAccessIncludePath /var/tmp
