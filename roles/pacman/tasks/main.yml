- name: Create directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
    owner: root
    mode: "755"
    state: directory
  loop:
    - /etc/pacman.d/hooks

- name: Enable mirrors
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.d/mirrorlist
    regexp: "^#?(Server = {{ item | regex_escape }})$"
    line: '\1'
    backrefs: true
  loop:
    - https://fastly.mirror.pkgbuild.com/$repo/os/$arch
    - https://geo.mirror.pkgbuild.com/$repo/os/$arch
    - https://ftp.sh.cvut.cz/arch/$repo/os/$arch
